<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>APTC - Actualités</title>

<style>
    /* ======== FOND ATMOSPHÉRIQUE ANIMÉ ======== */
    body {
        margin: 0;
        background: radial-gradient(circle at 20% 10%, #0a1a2f, #020712 70%, #000000 100%);
        color: white;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    /* Halo météo animé */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 10% 0%, rgba(30,144,255,0.45), transparent 60%),
            radial-gradient(circle at 90% 100%, rgba(0,206,209,0.35), transparent 60%);
        opacity: 0.45;
        pointer-events: none;
        mix-blend-mode: screen;
        animation: haloMove 12s infinite alternate ease-in-out;
    }

    @keyframes haloMove {
        0% { transform: translateY(0px); }
        100% { transform: translateY(20px); }
    }

    /* Grain léger */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.10;
        pointer-events: none;
    }

    /* ======== NAVBAR ======== */
    .navbar {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        padding: 12px 24px;
        border-bottom: 2px solid #1e90ff;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;

        backdrop-filter: blur(18px) saturate(180%);
        box-shadow: 0 0 40px rgba(0,0,0,0.8);

        background-image:
            radial-gradient(circle at 0% 0%, rgba(30,144,255,0.35), transparent 60%),
            radial-gradient(circle at 100% 100%, rgba(0,206,209,0.30), transparent 60%);
    }

    .navbar img {
        height: 48px;
        margin-right: 12px;
        filter: drop-shadow(0 0 12px rgba(30,144,255,1));
    }

    .navbar .title {
        font-size: 24px;
        font-weight: bold;
        margin-right: 40px;
        color: #ffffff;
        letter-spacing: 1px;
        text-shadow: 0 0 16px rgba(30,144,255,1);
        animation: titleGlow 4s infinite ease-in-out;
    }

    @keyframes titleGlow {
        0% { text-shadow: 0 0 12px rgba(30,144,255,0.7); }
        50% { text-shadow: 0 0 24px rgba(30,144,255,1); }
        100% { text-shadow: 0 0 12px rgba(30,144,255,0.7); }
    }

    .navbar a {
        margin-right: 22px;
        text-decoration: none;
        color: #cfe8ff;
        font-size: 18px;
        transition: 0.3s;
        position: relative;
    }

    .navbar a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -4px;
        width: 0%;
        height: 2px;
        background: #1e90ff;
        transition: width 0.3s;
        box-shadow: 0 0 10px #1e90ff;
    }

    .navbar a:hover::after {
        width: 100%;
    }

    .navbar a:hover {
        color: #1e90ff;
        text-shadow: 0 0 12px rgba(30,144,255,1);
    }

    /* ======== TITRE ======== */
    .header {
        text-align: center;
        margin-top: 140px;
        animation: fadeIn 1.4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .header h1 {
        font-size: 48px;
        margin-bottom: 16px;
        letter-spacing: 1.3px;
        text-shadow: 0 0 28px rgba(30,144,255,0.9);
        animation: glowPulse 4s infinite ease-in-out;
    }

    @keyframes glowPulse {
        0% { text-shadow: 0 0 22px rgba(30,144,255,0.7); }
        50% { text-shadow: 0 0 38px rgba(30,144,255,1); }
        100% { text-shadow: 0 0 22px rgba(30,144,255,0.7); }
    }

    /* ======== CONTENEUR ======== */
    .container {
        width: 90%;
        margin: 40px auto;
    }

    /* ======== GRILLE ======== */
    #newsContainer {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 35px;
        justify-items: center;
    }

    /* ======== CARTE ACTUALITÉ ======== */
    .news-card {
        background: radial-gradient(circle at top, rgba(10,20,40,0.9), rgba(0,0,0,0.7));
        border: 2px solid #1e90ff;
        border-radius: 20px;
        padding: 18px;
        width: 380px;
        box-shadow: 0 0 32px rgba(30,144,255,0.45);
        text-align: center;
        animation: fadeIn 0.45s ease;
        transition: 0.3s;
        transform: translateY(0);
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
    }

    .news-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 0 42px rgba(30,144,255,0.9);
        border-color: #63b3ff;
    }

    .news-card img {
        width: 100%;
        height: 185px;
        object-fit: cover;
        border-radius: 14px;
        margin-top: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
        cursor: pointer;
        transition: 0.3s;
    }

    .news-card img:hover {
        transform: scale(1.03);
    }

    .badge {
        display: inline-block;
        background: linear-gradient(135deg, #1e90ff, #63b3ff);
        padding: 5px 12px;
        border-radius: 10px;
        font-size: 12px;
        margin-bottom: 8px;
        color: white;
        font-weight: bold;
        box-shadow: 0 0 12px rgba(30,144,255,0.7);
    }

    .news-card h2 {
        margin: 0;
        font-size: 19px;
        color: #cfe8ff;
        font-weight: bold;
        margin-top: 8px;
        text-shadow: 0 0 8px #1e90ff;
    }

    .news-card p {
        opacity: 0.88;
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.45;
    }

    .news-meta {
        opacity: 0.75;
        font-size: 12px;
        margin-top: 6px;
        font-style: italic;
    }

    /* ======== LIGHTBOX ======== */
    .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s ease;
    }

    .lightbox.active {
        opacity: 1;
        pointer-events: auto;
    }

    .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 14px;
        box-shadow: 0 0 40px rgba(30,144,255,0.8);
        animation: zoomIn 0.35s ease;
    }

    @keyframes zoomIn {
        from { transform: scale(0.7); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 1100px) {
        #newsContainer {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 700px) {
        #newsContainer {
            grid-template-columns: repeat(1, 1fr);
        }
    }
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <img src="logo.png" alt="Logo APTC">
    <div class="title">A.P.T.C</div>

    <a href="index.html">Accueil</a>
    <a href="actualites.html">Actualités</a>
    <a href="alertes.html">Alertes</a>
    <a href="radars.html">Radars</a>
    <a href="recherches.html">Recherches</a>
    <a href="risques.html">Risques</a>
    <a href="saison-tornades.html">Saison Tornades</a>
    <a href="saison-cyclones-tropicaux.html">Saison Cyclones Tropicaux</a>
</div>

<!-- TITRE -->
<div class="header">
    <h1>Actualités Météo</h1>
</div>

<!-- CONTENU -->
<div class="container">
    <div id="newsContainer"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" onclick="fermerLightbox()">
    <img id="lightbox-img" src="">
</div>

<script>
let actualites = JSON.parse(localStorage.getItem("actualitesAPTC") || "[]");

function afficherActualites() {
    const container = document.getElementById("newsContainer");
    container.innerHTML = "";

    if (actualites.length === 0) {
        container.innerHTML = "<p>Aucune actualité disponible.</p>";
        return;
    }

    actualites.forEach((actu) => {
        const card = document.createElement("div");
        card.className = "news-card";

        card.innerHTML = `
            <div class="badge">${actu.categorie}</div>
            <h2>${actu.titre}</h2>
            <div class="news-meta">${actu.date}</div>
            <p>${actu.contenu}</p>
            ${actu.image ? `<img src="${actu.image}" onclick="ouvrirLightbox('${actu.image}')">` : ""}
        `;

        container.appendChild(card);
    });
}

/* ======== LIGHTBOX ======== */
function ouvrirLightbox(src) {
    const lb = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;
    lb.classList.add("active");
}

function fermerLightbox() {
    document.getElementById("lightbox").classList.remove("active");
}

afficherActualites();
</script>

</body>
</html>
