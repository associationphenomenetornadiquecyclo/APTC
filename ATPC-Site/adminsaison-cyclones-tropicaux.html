    <title>APTC - Admin Saison Cyclones Tropicaux 2026</title>

    <style>
        body {
            margin: 0;
            background: #0a1a2a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border-bottom: 2px solid #1e90ff;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar img {
            height: 45px;
            margin-right: 10px;
        }

        .navbar .title {
            font-size: 22px;
            font-weight: bold;
            margin-right: 40px;
            color: #ffffff;
        }

        .navbar a {
            margin-right: 20px;
            text-decoration: none;
            color: #cfe8ff;
            font-size: 18px;
            transition: 0.3s;
        }

        .navbar a:hover {
            color: #1e90ff;
        }

        #map {
            width: 100%;
            height: 600px;
            margin-top: 80px;
            border-bottom: 2px solid #1e90ff;
        }

        .layout {
            display: flex;
            width: 95%;
            margin: 20px auto;
            gap: 20px;
        }

        .sidebar {
            flex: 1;
            background: rgba(0,0,0,0.55);
            border: 2px solid #1e90ff;
            border-radius: 15px;
            padding: 15px;
            height: 600px;
            overflow-y: auto;
            box-shadow: 0 0 15px rgba(30,144,255,0.4);
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #1e90ff;
            padding-bottom: 5px;
        }

        .avis-item {
            background: rgba(0,0,0,0.45);
            border-left: 4px solid #1e90ff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .avis-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .avis-icon {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .avis-info {
            margin-top: 8px;
            font-size: 15px;
            opacity: 0.85;
        }

        .avis-item button {
            margin-top: 8px;
            margin-right: 6px;
            background: #1e90ff;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .avis-item button:hover {
            background: #63b3ff;
        }

        .avis-item button.delete-btn {
            background: #ff4444;
        }

        .avis-item button.delete-btn:hover {
            background: #ff7777;
        }

        .form-frame {
            flex: 2;
            background: rgba(0,0,0,0.55);
            border: 2px solid #1e90ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(30,144,255,0.4);
        }

        .form-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #1e90ff;
            padding-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #1e90ff;
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .form-frame button {
            background: #1e90ff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-frame button:hover {
            background: #63b3ff;
        }

        #avisErreur {
            color: #ffdd55;
            font-size: 15px;
            margin-top: 10px;
        }
    </style>
</head>

    const bassinsLabels = {

        WP: "Pacifique Ouest",

    function remplirListeCyclones() {
        const select = document.getElementById("cycloneNom");
        select.innerHTML = '<option value="">Sélectionner un système (par bassin)</option>';

        for (const bassin in cyclones2026) {
            const optgroup = document.createElement("optgroup");
            optgroup.label = `${bassinsLabels[bassin]} (${bassin})`;

            cyclones2026[bassin].forEach(cyc => {
                const opt = document.createElement("option");
                opt.value = JSON.stringify({ bassin, id: cyc.id, name: cyc.name });
                opt.textContent = `[${bassin}] ${cyc.name}`;
                optgroup.appendChild(opt);
            });

            select.appendChild(optgroup);
        }

        const optCustom = document.createElement("option");
        optCustom.value = "custom";
        optCustom.textContent = "Personnalisé (DT numérotée ou nom manuel)";
        select.appendChild(optCustom);
    }

    document.getElementById("cycloneNom").addEventListener("change", function() {
        const customField = document.getElementById("customName");

        if (this.value === "custom") {
            customField.style.display = "block";
        } else {
            customField.style.display = "none";
            customField.value = "";
        }
    });

    let avisCycloniques = JSON.parse(localStorage.getItem("avisCycloniques2026") || "[]");
    let avisEnEdition = null;

    function sauvegarderAvis() {
        localStorage.setItem("avisCycloniques2026", JSON.stringify(avisCycloniques));
    }

    const cycloneColors = {
        "depression_tropicale": "#4da6ff",
        "tempete_tropicale": "#00cc44",
        1: "#ffeb3b",
        2: "#ffb347",
        3: "#cc5500",
        4: "#ff0000",
        5: "#ff66cc",
        "depression_subtropicale": "#8e24aa",
        "tempete_subtropicale": "#7CFC00",
        "depression_extratropicale": "#4da6ff",
        "tempete_extratropicale": "#33ff77",
        "extratropicale_cat1": "#fff066",
        "extratropicale_cat2": "#ffb347",
        "post_tropical": "#999999"
    };

    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 8
    }).addTo(map);

    let modeTrajectoire = false;
    let pointsTrajectoire = [];
    let segmentsTrajectoire = [];
    let marqueursTrajectoire = [];
    let intensiteActuelle = null;

    const TrajectoireControl = L.Control.extend({
        options: { position: 'topright' },

        onAdd: function() {
            const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');

            const btn = L.DomUtil.create('a', '', container);
            btn.innerHTML = "🌀";
            btn.title = "Tracer une trajectoire";
            btn.style.fontSize = "20px";
            btn.style.padding = "6px 10px";
            btn.style.cursor = "pointer";
            btn.style.background = "#1e90ff";
            btn.style.color = "#ffffff";
            btn.style.textDecoration = "none";

            L.DomEvent.on(btn, 'click', function(e) {
                L.DomEvent.stopPropagation(e);
                activerTrajectoire();
            });

            return container;
        }
    });

    map.addControl(new TrajectoireControl());

    const IntensiteControl = L.Control.extend({
        options: { position: 'topright' },

        onAdd: function() {
            const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');

            const select = L.DomUtil.create('select', '', container);
            select.style.padding = "6px";
            select.style.background = "#1e90ff";
            select.style.color = "white";
            select.style.border = "none";
            select.style.fontSize = "14px";
            select.style.cursor = "pointer";

            select.innerHTML = `
                <option value="">Intensité (points)</option>
                <option value="depression_tropicale">Dépression tropicale</option>
                <option value="tempete_tropicale">Tempête tropicale</option>
                <option value="1">Catégorie 1</option>

                <option value="3">Catégorie 3</option>
                <option value="4">Catégorie 4</option>
                <option value="5">Catégorie 5</option>

                <option value="tempete_subtropicale">Tempête subtropicale</option>
                <option value="depression_extratropicale">Dépression extratropicale (EX-D)</option>
                <option value="tempete_extratropicale">Tempête extratropicale (EX-S)</option>
                <option value="extratropicale_cat1">EX Catégorie 1</option>
                <option value="extratropicale_cat2">EX Catégorie 2</option>
                <option value="post_tropical">Post-tropical</option>
            `;

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(select, 'change', function() {
                intensiteActuelle = select.value;
            });

            return container;
        }
    });

    map.addControl(new IntensiteControl());

    function markerCarre(couleur) {
        return L.divIcon({
            className: "",
            html: `<div style="
                width:14px;
                height:14px;
                background:${couleur};
                border:2px solid black;
            "></div>`
        });
    }

    function markerTriangle(couleur) {
        return L.divIcon({
            className: "",
            html: `
                <div style="
                    position: relative;
                    width: 0;
                    height: 0;
                    border-left: 8px solid transparent;
                    border-right: 8px solid transparent;
                    border-bottom: 14px solid ${couleur};
                ">
                    <div style="
                        position: absolute;
                        top: 2px;
                        left: -9px;
                        width: 0;
                        height: 0;
                        border-left: 9px solid transparent;
                        border-right: 9px solid transparent;
                        border-bottom: 16px solid black;
                        z-index: -1;
                    "></div>
                </div>
            `
        });
    }

    function markerCercle(couleur) {
        return L.divIcon({
            className: "",
            html: `<div style="
                width:14px;
                height:14px;
                background:${couleur};
                border-radius:50%;
                border:2px solid black;
            "></div>`
        });
    }

    function getMarkerForm(categorie) {
        const couleur = cycloneColors[categorie] || "#00aaff";

        if (categorie.includes("subtropicale")) return markerCarre(couleur);

        if (
            categorie.includes("extratropical") ||
            categorie === "post_tropical"
        ) return markerTriangle(couleur);

        return markerCercle(couleur);
    }

    function activerTrajectoire() {
        modeTrajectoire = true;
        pointsTrajectoire = [];
        segmentsTrajectoire.forEach(seg => map.removeLayer(seg));
        segmentsTrajectoire = [];
        marqueursTrajectoire.forEach(m => map.removeLayer(m));
        marqueursTrajectoire = [];

        document.getElementById("avisErreur").textContent =
            "Mode traçage activé : choisissez une intensité puis cliquez sur la carte.";
    }

    map.on("click", function(e) {
        if (!modeTrajectoire) return;

        if (!intensiteActuelle) {
            document.getElementById("avisErreur").textContent =
                "Sélectionnez une intensité avant de tracer.";
            return;
        }

        const latlng = [e.latlng.lat, e.latlng.lng];

        const point = {
            lat: latlng[0],
            lon: latlng[1],
            categorie: intensiteActuelle
        };

        pointsTrajectoire.push(point);

        const icone = getMarkerForm(point.categorie);
        const marker = L.marker(latlng, { icon: icone }).addTo(map);
        marqueursTrajectoire.push(marker);

        if (pointsTrajectoire.length > 1) {
            const prev = pointsTrajectoire[pointsTrajectoire.length - 2];
            const curr = pointsTrajectoire[pointsTrajectoire.length - 1];

            const segColor = cycloneColors[curr.categorie];

            const segment = L.polyline(
                [
                    [prev.lat, prev.lon],
                    [curr.lat, curr.lon]
                ],
                {
                    color: segColor,
                    weight: 4,
                    opacity: 0.9
                }
            ).addTo(map);

            segmentsTrajectoire.push(segment);
        }
    });

    function afficherAvis() {
        const container = document.getElementById("avisList");
        container.innerHTML = "";

        if (avisCycloniques.length === 0) {
            container.innerHTML = "<p>Aucun avis cyclonique enregistré pour 2026.</p>";
            return;
        }

        avisCycloniques.forEach((avis, index) => {
            const div = document.createElement("div");
            div.className = "avis-item";

            const header = document.createElement("div");
            header.className = "avis-header";

            const icon = document.createElement("div");
            icon.className = "avis-icon";
            icon.style.backgroundColor = cycloneColors[avis.categorie] || "#ffffff";

            const title = document.createElement("div");
            title.textContent = `${avis.nom} — ${avis.categorieLabel}`;

            header.appendChild(icon);
            header.appendChild(title);

            const info = document.createElement("div");
            info.className = "avis-info";
            info.innerHTML = `
                <strong>Bassin :</strong> ${avis.bassin}<br>
                <strong>Décès :</strong> ${avis.deces || "N/A"}<br>
                <strong>Dommages :</strong> ${avis.dommages || "N/A"}<br>
                <strong>Région :</strong> ${avis.region || "N/A"}<br>
                <strong>Source :</strong> ${avis.source || "N/A"}<br>
                <strong>Description :</strong> ${avis.description || "N/A"}
            `;

            const btnSuppr = document.createElement("button");
            btnSuppr.textContent = "Supprimer";
            btnSuppr.className = "delete-btn";
            btnSuppr.onclick = (event) => {
                event.stopPropagation();
                avisCycloniques.splice(index, 1);
                sauvegarderAvis();
                afficherAvis();
            };

            const btnModifier = document.createElement("button");
            btnModifier.textContent = "Modifier";
            btnModifier.onclick = (event) => {
                event.stopPropagation();
                modifierAvis(index);
            };

            div.appendChild(header);
            div.appendChild(info);
            div.appendChild(btnSuppr);
            div.appendChild(btnModifier);

            div.onclick = () => afficherTrajectoire(avis);

            container.appendChild(div);
        });
    }

    function ajouterAvis() {
        const selectCyclone = document.getElementById("cycloneNom");
        const categorie = document.getElementById("cycloneCategorie").value;
        const deces = document.getElementById("avisDeces").value;
        const dommages = document.getElementById("avisDommages").value;
        const region = document.getElementById("avisRegion").value;
        const source = document.getElementById("avisSource").value;
        const description = document.getElementById("avisDescription").value;
        const erreurDiv = document.getElementById("avisErreur");

        erreurDiv.textContent = "";

        if (!selectCyclone.value || !categorie || !description.trim()) {
            erreurDiv.textContent = "Veuillez sélectionner un système, une intensité et saisir une description.";
            return;
        }

        let cycloneData;

        if (selectCyclone.value === "custom") {
            const customName = document.getElementById("customName").value.trim();
            if (!customName) {
                erreurDiv.textContent = "Veuillez entrer un nom personnalisé ou un numéro (01Q, 01M...).";
                return;
            }

            cycloneData = {
                bassin: "Personnalisé",
                id: "CUSTOM2026",
                name: customName
            };
        } else {
            cycloneData = JSON.parse(selectCyclone.value);
        }

        const categorieLabelMap = {
            "depression_subtropicale": "Dépression subtropicale",
            "tempete_subtropicale": "Tempête subtropicale",
            "depression_tropicale": "Dépression tropicale",
            "tempete_tropicale": "Tempête tropicale",
            "1": "Catégorie 1",
            "2": "Catégorie 2",
            "3": "Catégorie 3",
            "4": "Catégorie 4",
            "5": "Catégorie 5"
        };

        const avis = {
            bassin: cycloneData.bassin,
            id: cycloneData.id,
            nom: cycloneData.name,
            categorie: categorie,
            categorieLabel: categorieLabelMap[categorie] || categorie,
            deces: deces,
            dommages: dommages,
            region: region,
            source: source,
            description: description,
            trajectoire: null
        };

        if (modeTrajectoire && pointsTrajectoire.length > 0) {
            // CORRECTION : on enregistre au format attendu par le spectateur
            avis.trajectoire = [
                pointsTrajectoire.map(p => ({
                    lat: p.lat,
                    lon: p.lon,
                    categorie: p.categorie
                }))
            ];
            modeTrajectoire = false;
            erreurDiv.textContent = "Avis et trajectoire enregistrés avec succès.";
        } else {
            erreurDiv.textContent = "Avis enregistré (aucune trajectoire associée).";
        }

        if (avisEnEdition !== null) {
            avisCycloniques[avisEnEdition] = avis;
            avisEnEdition = null;
        } else {
            avisCycloniques.push(avis);
        }

        sauvegarderAvis();
        afficherAvis();

        document.getElementById("avisDeces").value = "";
        document.getElementById("avisDommages").value = "";
        document.getElementById("avisRegion").value = "";
        document.getElementById("avisSource").value = "";
        document.getElementById("avisDescription").value = "";
        document.getElementById("customName").value = "";
    }

    function modifierAvis(index) {
        const avis = avisCycloniques[index];
        avisEnEdition = index;

        if (avis.bassin === "Personnalisé") {
            document.getElementById("cycloneNom").value = "custom";
            document.getElementById("customName").style.display = "block";
            document.getElementById("customName").value = avis.nom;
        } else {
            document.getElementById("cycloneNom").value = JSON.stringify({
                bassin: avis.bassin,
                id: avis.id,
                name: avis.nom
            });
            document.getElementById("customName").style.display = "none";
            document.getElementById("customName").value = "";
        }

        document.getElementById("cycloneCategorie").value = avis.categorie;
        document.getElementById("avisDeces").value = avis.deces;
        document.getElementById("avisDommages").value = avis.dommages;
        document.getElementById("avisRegion").value = avis.region;
        document.getElementById("avisSource").value = avis.source;
        document.getElementById("avisDescription").value = avis.description;

        document.getElementById("avisErreur").textContent =
            "Mode édition : vous modifiez un avis existant.";
    }

    function afficherTrajectoire(avis) {
        segmentsTrajectoire.forEach(seg => map.removeLayer(seg));
        segmentsTrajectoire = [];
        marqueursTrajectoire.forEach(m => map.removeLayer(m));
        marqueursTrajectoire = [];

        if (!avis.trajectoire || avis.trajectoire.length === 0) {
            document.getElementById("avisErreur").textContent =
                "Ce système n’a pas de trajectoire enregistrée.";
            return;
        }

        // avis.trajectoire est maintenant un tableau de segments
        const segments = avis.trajectoire;
        let allPts = [];

        segments.forEach(seg => {
            seg.forEach(p => {
                const icone = getMarkerForm(p.categorie);
                const marker = L.marker([p.lat, p.lon], { icon: icone }).addTo(map);
                marqueursTrajectoire.push(marker);
                allPts.push([p.lat, p.lon]);
            });

            for (let i = 1; i < seg.length; i++) {
                const prev = seg[i - 1];
                const curr = seg[i];

                const segColor = cycloneColors[curr.categorie];

                const segment = L.polyline(
                    [
                        [prev.lat, prev.lon],
                        [curr.lat, curr.lon]
                    ],
                    {
                        color: segColor,
                        weight: 4,
                        opacity: 0.9
                    }
                ).addTo(map);

                segmentsTrajectoire.push(segment);
            }
        });

        if (allPts.length > 0) {
            const bounds = L.latLngBounds(allPts);
            map.fitBounds(bounds);
        }
    }

    remplirListeCyclones();
    afficherAvis();
    </script>
