<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>APTC - Publier une actualité</title>

    <style>
        body {
            margin: 0;
            background: #0a1a2a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border-bottom: 2px solid #1e90ff;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar img {
            height: 45px;
            margin-right: 10px;
        }

        .navbar .title {
            font-size: 22px;
            font-weight: bold;
            margin-right: 40px;
            color: #ffffff;
        }

        .navbar a {
            margin-right: 20px;
            text-decoration: none;
            color: #cfe8ff;
            font-size: 18px;
            transition: 0.3s;
        }

        .navbar a:hover {
            color: #1e90ff;
        }

        .container {
            width: 90%;
            margin: 140px auto;
        }

        .form-frame {
            background: rgba(0,0,0,0.55);
            border: 2px solid #1e90ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(30,144,255,0.4);
            width: 60%;
            margin: auto;
        }

        .form-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #1e90ff;
            padding-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #1e90ff;
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            background: #1e90ff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
            margin-right: 10px;
        }

        button:hover {
            background: #63b3ff;
        }

        .delete-btn {
            background: #ff4444;
        }

        .delete-btn:hover {
            background: #ff7777;
        }

        #imageZone {
            width: 100%;
            height: 120px;
            border: 2px dashed #1e90ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cfe8ff;
            cursor: pointer;
            margin-bottom: 12px;
            text-align: center;
            font-size: 14px;
        }

        #imagePreview {
            width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="logo.png" alt="Logo APTC">
        <div class="title">A.P.T.C — Admin</div>

        <a href="adminindex.html">Accueil</a>
        <a href="adminactualites.html">Actualités</a>
        <a href="adminalertes.html">Alertes</a>
        <a href="adminradars.html">Radars</a>
        <a href="adminrecherches.html">Recherches</a>
        <a href="adminrisques.html">Risques</a>
        <a href="adminsaison-tornades.html">Saison Tornades</a>
        <a href="adminsaison-cyclones-tropicaux.html">Saison Cyclones Tropicaux</a>
    </div>

    <div class="container">

        <div class="form-frame">
            <div class="form-title" id="formTitle">Publier une actualité</div>

            <input type="text" id="newsTitre" placeholder="Titre de l'actualité">
            <textarea id="newsContenu" placeholder="Contenu de l'actualité"></textarea>

            <select id="newsCategorie">
                <option value="">Catégorie</option>
                <option value="Actualité">Actualités</option>
                <option value="Alerte">Alertes</option>
                <option value="Cyclone">Cyclones</option>
                <option value="Tornade">Tornades</option>
                <option value="Radar">Radars</option>
            </select>

            <div id="imageZone">
                Coller une image ici (Ctrl+V)<br>
                (capture d'écran, carte, radar, etc.)
            </div>

            <img id="imagePreview" alt="Prévisualisation de l'image">

            <button id="btnPublier" onclick="publierActualite()">Publier</button>
            <button id="btnModifier" style="display:none;" onclick="modifierActualite()">Modifier</button>
            <button id="btnSupprimer" class="delete-btn" style="display:none;" onclick="supprimerActualite()">Supprimer</button>
        </div>

    </div>

<script>
let actualites = JSON.parse(localStorage.getItem("actualitesAPTC") || "[]");
let imageBase64 = "";
let editIndex = null;

/* Collage d'image */
document.getElementById("imageZone").addEventListener("paste", function(e) {
    const items = e.clipboardData.items;

    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
            const file = items[i].getAsFile();
            const reader = new FileReader();

            reader.onload = function(event) {
                imageBase64 = event.target.result;
                const preview = document.getElementById("imagePreview");
                preview.src = imageBase64;
                preview.style.display = "block";
            };

            reader.readAsDataURL(file);
        }
    }
});

/* Sauvegarde */
function sauvegarder() {
    localStorage.setItem("actualitesAPTC", JSON.stringify(actualites));
}

/* Mode édition */
const params = new URLSearchParams(window.location.search);
if (params.has("edit")) {
    editIndex = parseInt(params.get("edit"));
    chargerEdition(editIndex);
}

function chargerEdition(index) {
    const actu = actualites[index];

    document.getElementById("formTitle").textContent = "Modifier une actualité";
    document.getElementById("newsTitre").value = actu.titre;
    document.getElementById("newsContenu").value = actu.contenu;
    document.getElementById("newsCategorie").value = actu.categorie;

    if (actu.image) {
        imageBase64 = actu.image;
        const preview = document.getElementById("imagePreview");
        preview.src = imageBase64;
        preview.style.display = "block";
    }

    document.getElementById("btnPublier").style.display = "none";
    document.getElementById("btnModifier").style.display = "inline-block";
    document.getElementById("btnSupprimer").style.display = "inline-block";
}

/* Publier */
function publierActualite() {
    const titre = document.getElementById("newsTitre").value.trim();
    const contenu = document.getElementById("newsContenu").value.trim();
    const categorie = document.getElementById("newsCategorie").value;

    if (!titre || !contenu || !categorie) {
        alert("Veuillez remplir le titre, le contenu et la catégorie.");
        return;
    }

    const actu = {
        titre,
        contenu,
        categorie,
        image: imageBase64,
        date: new Date().toLocaleString()
    };

    actualites.push(actu);
    sauvegarder();

    alert("Actualité publiée !");
    window.location.href = "adminactualites.html";
}

/* Modifier */
function modifierActualite() {
    const titre = document.getElementById("newsTitre").value.trim();
    const contenu = document.getElementById("newsContenu").value.trim();
    const categorie = document.getElementById("newsCategorie").value;

    actualites[editIndex] = {
        titre,
        contenu,
        categorie,
        image: imageBase64,
        date: new Date().toLocaleString()
    };

    sauvegarder();
    alert("Actualité modifiée !");
    window.location.href = "adminactualites.html";
}

/* Supprimer */
function supprimerActualite() {
    if (!confirm("Supprimer cette actualité ?")) return;

    actualites.splice(editIndex, 1);
    sauvegarder();

    alert("Actualité supprimée !");
    window.location.href = "adminactualites.html";
}
</script>

</body>
</html>
