<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>APTC - Alertes</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
/* ======== FOND ATMOSPHÉRIQUE ULTRA-PREMIUM ======== */
body {
    margin: 0;
    background: radial-gradient(circle at 20% 10%, #07101f, #020712 70%, #000000 100%);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Halo météo */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 10%, rgba(30,144,255,0.55), transparent 60%),
        radial-gradient(circle at 85% 90%, rgba(0,206,209,0.45), transparent 60%);
    opacity: 0.55;
    pointer-events: none;
    mix-blend-mode: screen;
    animation: haloMove 14s infinite alternate ease-in-out;
}

@keyframes haloMove {
    0% { transform: translateY(0px); }
    100% { transform: translateY(25px); }
}

/* Grain */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.12;
    pointer-events: none;
}

/* ======== NAVBAR CINÉMATIQUE ======== */
.navbar {
    display: flex;
    align-items: center;
    background: rgba(0,0,0,0.75);
    padding: 12px 24px;
    border-bottom: 2px solid #1e90ff;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    backdrop-filter: blur(18px) saturate(180%);
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

.navbar img {
    height: 48px;
    margin-right: 12px;
    filter: drop-shadow(0 0 12px rgba(30,144,255,1));
}

.navbar .title {
    font-size: 24px;
    font-weight: bold;
    margin-right: 40px;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 0 0 16px rgba(30,144,255,1);
}

.navbar a {
    margin-right: 22px;
    text-decoration: none;
    color: #cfe8ff;
    font-size: 18px;
    transition: 0.3s;
    position: relative;
}

.navbar a:hover {
    color: #1e90ff;
    text-shadow: 0 0 12px rgba(30,144,255,1);
}

/* ======== LAYOUT ======== */
.content {
    display: flex;
    margin-top: 80px;
    height: calc(100vh - 80px);
}

/* ======== SIDEBAR PREMIUM ======== */
.sidebar {
    width: 320px;
    background: rgba(0,0,0,0.55);
    padding: 20px;
    border-right: 1px solid rgba(255,255,255,0.15);
    overflow-y: auto;
    backdrop-filter: blur(14px);
}

.sidebar h2 {
    margin-top: 0;
    font-size: 24px;
    text-shadow: 0 0 12px rgba(30,144,255,0.8);
}

/* Carte alerte */
.alert-item {
    background: rgba(255,255,255,0.12);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.25s;
    border: 1px solid rgba(255,255,255,0.18);
}

.alert-item:hover {
    background: rgba(255,255,255,0.20);
    transform: translateY(-3px);
}

.alert-color {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    display: inline-block;
    margin-right: 8px;
}

/* ======== CARTE ======== */
#map {
    flex: 1;
    filter: drop-shadow(0 0 12px rgba(0,0,0,0.6));
}

/* ======== LÉGENDE PREMIUM ======== */
.legende-alertes {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.55);
    padding: 18px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.18);
    font-size: 15px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 22px rgba(0,0,0,0.6);
}

.legende-alertes h3 {
    margin-top: 0;
    margin-bottom: 10px;
    text-shadow: 0 0 12px rgba(30,144,255,0.8);
}

.legende-alertes .ligne {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
}

.legende-alertes .couleur {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    margin-right: 8px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <img src="logo.png">
    <div class="title">A.P.T.C</div>

    <a href="index.html">Accueil</a>
    <a href="actualites.html">Actualités</a>
    <a href="alertes.html">Alertes</a>
    <a href="radars.html">Radars</a>
    <a href="recherches.html">Recherches</a>
    <a href="risques.html">Risques</a>
    <a href="saison-tornades.html">Saison Tornades</a>
    <a href="saison-cyclones-tropicaux.html">Saison Cyclones Tropicaux</a>
</div>

<div class="content">

    <!-- LISTE DES ALERTES -->
    <div class="sidebar">
        <h2>Alertes actives</h2>
        <div id="alertList"></div>
    </div>

    <!-- CARTE -->
    <div id="map"></div>
</div>

<!-- LÉGENDE -->
<div class="legende-alertes">
    <h3>Légende des alertes</h3>
    <div class="ligne"><span class="couleur" style="background:#ff0000;"></span> Tornado Warning</div>
    <div class="ligne"><span class="couleur" style="background:#ff7f00;"></span> Orage sévère</div>
    <div class="ligne"><span class="couleur" style="background:#8a2be2;"></span> Grêle</div>
    <div class="ligne"><span class="couleur" style="background:#ffff00;"></span> Foudre intense</div>
    <div class="ligne"><span class="couleur" style="background:#0066ff;"></span> Pluie extrême</div>
    <div class="ligne"><span class="couleur" style="background:#00ffff;"></span> Vent violent</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([46.8, 2.5], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 12,
    minZoom: 4
}).addTo(map);

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

const alertList = document.getElementById("alertList");

function loadAlerts() {
    alertList.innerHTML = "";
    drawnItems.clearLayers();

    const saved = localStorage.getItem("alertes_zones");
    if (!saved) return;

    const data = JSON.parse(saved);

    data.forEach((item, index) => {
        const layer = L.polygon(item.coords, {
            color: item.color,
            fillColor: item.color,
            fillOpacity: 0.4
        });

        layer.bindPopup(`
            <strong>${item.alert}</strong><br>
            Jour : ${item.day}<br>
            Heure : ${item.time}
        `);

        drawnItems.addLayer(layer);

        const div = document.createElement("div");
        div.className = "alert-item";
        div.innerHTML = `
            <span class="alert-color" style="background:${item.color};"></span>
            <strong>${item.alert}</strong><br>
            Jour : ${item.day} — ${item.time}
        `;

        div.addEventListener("click", () => {
            map.fitBounds(layer.getBounds());
            layer.openPopup();
        });

        alertList.appendChild(div);
    });
}

loadAlerts();
setInterval(loadAlerts, 2000);

window.addEventListener("storage", (event) => {
    if (event.key === "alertes_zones") {
        loadAlerts();
    }
});
</script>

</body>
</html>
