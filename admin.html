<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accès Admin - APTC</title>

<style>
/* ======== FOND ATMOSPHÉRIQUE ULTIME ======== */
body {
    margin: 0;
    background: radial-gradient(circle at 20% 10%, #07101f, #020712 70%, #000000 100%);
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Halo météo multi-couches */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 10%, rgba(30,144,255,0.55), transparent 60%),
        radial-gradient(circle at 85% 90%, rgba(0,206,209,0.45), transparent 60%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 70%);
    opacity: 0.55;
    pointer-events: none;
    mix-blend-mode: screen;
    animation: haloMove 14s infinite alternate ease-in-out;
}

@keyframes haloMove {
    0% { transform: translateY(0px); }
    100% { transform: translateY(25px); }
}

/* Grain + particules */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
        url('https://grainy-gradients.vercel.app/noise.svg'),
        radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: cover, 3px 3px;
    opacity: 0.12;
    pointer-events: none;
}

/* ======== PARTICULES LUMINEUSES ======== */
.particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(30,144,255,0.9);
    border-radius: 50%;
    filter: blur(2px);
    animation: floatUp 6s infinite ease-in-out;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
}

/* ======== FLÈCHE RETOUR HOLOGRAPHIQUE ======== */
.back-arrow {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #cfe8ff;
    font-size: 22px;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 10px;
    transition: 0.3s;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 0 18px rgba(30,144,255,0.7);
}

.back-arrow:hover {
    background: rgba(255,255,255,0.20);
    transform: translateX(-6px);
}

/* ======== BOÎTE DE CONNEXION ULTIME ======== */
.login-box {
    background: rgba(255,255,255,0.12);
    padding: 45px 50px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.25);
    text-align: center;
    width: 400px;
    backdrop-filter: blur(22px);
    box-shadow: 0 0 50px rgba(0,0,0,0.7);
    animation: fadeIn 1.2s ease;
    position: relative;
    z-index: 2;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 30px;
    text-shadow: 0 0 22px rgba(30,144,255,1);
}

p {
    margin-bottom: 20px;
    color: #cfe8ff;
    font-size: 17px;
}

/* Champ de saisie */
input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.10);
    color: white;
    font-size: 18px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #1e90ff;
    box-shadow: 0 0 16px rgba(30,144,255,0.8);
}

/* Bouton Valider */
button {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1e90ff, #63b3ff);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 26px rgba(30,144,255,0.8);
    font-weight: bold;
}

button:hover {
    background: #63b3ff;
    box-shadow: 0 0 36px rgba(30,144,255,1);
    transform: translateY(-3px);
}

/* Message d'erreur */
#message {
    margin-top: 15px;
    color: #ff6b6b;
    font-size: 16px;
    text-shadow: 0 0 10px rgba(255,50,50,0.8);
}

/* Vibration si code incorrect */
.shake {
    animation: shakeAnim 0.4s ease;
}

@keyframes shakeAnim {
    0% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
}
</style>
</head>

<body>

<!-- PARTICULES -->
<div class="particles">
    <div class="particle" style="top:80%; left:20%; animation-delay:0s;"></div>
    <div class="particle" style="top:70%; left:50%; animation-delay:1s;"></div>
    <div class="particle" style="top:85%; left:75%; animation-delay:2s;"></div>
    <div class="particle" style="top:60%; left:30%; animation-delay:3s;"></div>
    <div class="particle" style="top:90%; left:60%; animation-delay:4s;"></div>
</div>

<!-- FLÈCHE RETOUR -->
<a href="index.html" class="back-arrow">← Retour</a>

<!-- BOÎTE DE CONNEXION -->
<div class="login-box" id="loginBox">
    <h2>Accès Admin</h2>
    <p>Entrez le code d’accès :</p>

    <input type="password" id="adminCode" placeholder="Code admin">

    <button onclick="checkCode()">Valider</button>

    <div id="message"></div>
</div>

<script>
function checkCode() {
    const code = document.getElementById('adminCode').value;
    const box = document.getElementById('loginBox');
    const adminCode = "ATPC2026";

    if (code === adminCode) {
        window.location.href = "adminindex.html";
    } else {
        document.getElementById('message').textContent = "Code incorrect.";
        box.classList.add("shake");
        setTimeout(() => box.classList.remove("shake"), 400);
    }
}
</script>

</body>
</html>
