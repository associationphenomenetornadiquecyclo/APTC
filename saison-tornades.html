<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Saison Tornades – Spectateur</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
/* ======== FOND ATMOSPHÉRIQUE ULTRA-PREMIUM ======== */
body {
    margin: 0;
    background: radial-gradient(circle at 20% 10%, #07101f, #020712 70%, #000000 100%);
    color: #f5f5f5;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Halo météo */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 10%, rgba(30,144,255,0.55), transparent 60%),
        radial-gradient(circle at 85% 90%, rgba(0,206,209,0.45), transparent 60%);
    opacity: 0.55;
    pointer-events: none;
    mix-blend-mode: screen;
    animation: haloMove 14s infinite alternate ease-in-out;
}

@keyframes haloMove {
    0% { transform: translateY(0px); }
    100% { transform: translateY(25px); }
}

/* Grain */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.12;
    pointer-events: none;
}

/* ======== BARRE DES TÂCHES PREMIUM ======== */
#top-bar {
    height: 40px;
    width: 100vw;
    background: rgba(0,0,0,0.75);
    border-bottom: 1px solid #1e90ff;
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #e5e7eb;
    font-size: 14px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 22px rgba(0,0,0,0.6);
}

#top-bar span {
    margin-left: 10px;
    font-size: 12px;
    color: #9ca3af;
}

/* ======== CONTENEUR GLOBAL ======== */
.container {
    display: flex;
    height: calc(100vh - 40px);
    width: 100vw;
}

/* ======== SIDEBAR PREMIUM ======== */
#sidebar {
    width: 330px;
    background: rgba(0,0,0,0.55);
    border-right: 1px solid rgba(255,255,255,0.15);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    backdrop-filter: blur(14px);
}

#sidebar h2 {
    font-size: 20px;
    margin-bottom: 4px;
    text-shadow: 0 0 12px rgba(30,144,255,0.8);
}

#annee-active {
    font-size: 13px;
    color: #9ca3af;
}

/* ======== LISTE DES TORNADES ======== */
#liste-tornades {
    flex: 1;
    overflow-y: auto;
    margin-top: 6px;
    padding-right: 4px;
}

.tornade-item {
    background: rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    font-size: 13px;
    cursor: pointer;
    transition: 0.25s;
}

.tornade-item:hover {
    background: rgba(255,255,255,0.20);
    transform: translateY(-2px);
}

.tornade-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
}

.tornade-item-title {
    font-weight: bold;
}

.tornade-item-meta {
    font-size: 11px;
    color: #9ca3af;
    margin-bottom: 4px;
}

/* ======== ZONE CARTE ======== */
#main {
    flex: 1;
    position: relative;
    background: #020617;
}

/* ======== SÉLECTEUR D’ANNÉES PREMIUM ======== */
#top-right-bar {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
}

#annees-selector {
    background: rgba(0,0,0,0.55);
    border-radius: 6px;
    padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.18);
    font-size: 13px;
    color: #e5e7eb;
    backdrop-filter: blur(12px);
}

#annees-selector span {
    margin: 0 4px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: 0.25s;
}

#annees-selector span.active {
    background: #2563eb;
    color: #f9fafb;
}

#annees-selector span:hover {
    background: rgba(255,255,255,0.12);
}

/* ======== CARTE ======== */
#map {
    height: 100%;
    width: 100%;
    filter: drop-shadow(0 0 12px rgba(0,0,0,0.6));
}

/* ======== LÉGENDE EF PREMIUM ======== */
#legende-ef {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 1000;
    background: rgba(0,0,0,0.55);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #e5e7eb;
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 22px rgba(0,0,0,0.6);
}

.ef-color {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 6px;
    border-radius: 3px;
}

.ef0 { background:#007bff; }
.ef1 { background:#00cc44; }
.ef2 { background:#ffeb3b; }
.ef3 { background:#ff9800; }
.ef4 { background:#ff0000; }
.ef5 { background:#8e24aa; }
</style>
</head>

<body>

<!-- BARRE DES TÂCHES -->
<div id="top-bar">
    APTC – Saison Tornades
    <span>Visualisation publique</span>
</div>

<div class="container">

    <!-- PANNEAU GAUCHE -->
    <div id="sidebar">
        <h2>Saison Tornades</h2>
        <div id="annee-active">Année active : <span id="annee-label">2026</span></div>

        <h3 style="font-size:14px; margin-top:6px;">Tornades de l’année</h3>
        <div id="liste-tornades"></div>
    </div>

    <!-- ZONE CARTE -->
    <div id="main">

        <!-- SÉLECTEUR D’ANNÉES -->
        <div id="top-right-bar">
            <div id="annees-selector">
                <span data-annee="2026" class="active">2026</span>
                <span data-annee="2027">2027</span>
                <span data-annee="2028">2028</span>
            </div>
        </div>

        <!-- CARTE -->
        <div id="map"></div>

        <!-- LÉGENDE EF -->
        <div id="legende-ef">
            <h4>Légende EF</h4>
            <div><span class="ef-color ef0"></span>EF0 – Bleu</div>
            <div><span class="ef-color ef1"></span>EF1 – Vert</div>
            <div><span class="ef-color ef2"></span>EF2 – Jaune</div>
            <div><span class="ef-color ef3"></span>EF3 – Orange</div>
            <div><span class="ef-color ef4"></span>EF4 – Rouge</div>
            <div><span class="ef-color ef5"></span>EF5 – Violet</div>
        </div>

    </div>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ============================================================
   VARIABLES
   ============================================================ */
let map;
let drawnItems;
let anneeActive = 2026;
let tornades = {};

/* ============================================================
   INIT
   ============================================================ */
initTornadesData();
initMap();
initUI();
afficherTornadesAnnee(anneeActive);

/* ============================================================
   CHARGEMENT DONNÉES
   ============================================================ */
function initTornadesData() {
    const saved = localStorage.getItem("tornades_par_annee_v2");
    if (saved) tornades = JSON.parse(saved);
    else tornades = { 2026:[], 2027:[], 2028:[] };
}

/* ============================================================
   INIT CARTE
   ============================================================ */
function initMap() {
    map = L.map('map').setView([48.5, 2.5], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom:18,
        attribution:'&copy; OpenStreetMap'
    }).addTo(map);

    drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);
}

/* ============================================================
   INIT UI
   ============================================================ */
function initUI() {
    const anneesSelector = document.getElementById("annees-selector");
    const anneeLabel = document.getElementById("annee-label");

    anneesSelector.querySelectorAll("span").forEach(span => {
        span.addEventListener("click", () => {
            const annee = parseInt(span.dataset.annee);
            anneeActive = annee;
            anneeLabel.textContent = annee;

            anneesSelector.querySelectorAll("span").forEach(s => s.classList.remove("active"));
            span.classList.add("active");

            afficherTornadesAnnee(anneeActive);
        });
    });
}

/* ============================================================
   AFFICHAGE LISTE + CARTE
   ============================================================ */
function afficherTornadesAnnee(annee) {
    const listeDiv = document.getElementById("liste-tornades");
    listeDiv.innerHTML = "";
    drawnItems.clearLayers();

    const liste = tornades[annee] || [];

    if (liste.length === 0) {
        listeDiv.innerHTML = "<div style='font-size:12px; color:#9ca3af;'>Aucune tornade enregistrée.</div>";
        return;
    }

    let allPoints = [];

    liste.forEach((t, index) => {
        /* --- LISTE --- */
        const item = document.createElement("div");
        item.className = "tornade-item";

        item.innerHTML = `
            <div class="tornade-item-header">
                <div class="tornade-item-title">${t.nom}</div>
                <div>${t.efmax}</div>
            </div>
            <div class="tornade-item-meta">Date : ${t.date}</div>
        `;

        item.addEventListener("click", () => {
            zoomSurTornade(t);
        });

        listeDiv.appendChild(item);

        /* --- CARTE : TRAJECTOIRE --- */
        t.trajectoire.forEach(seg => {
            const poly = L.polyline(seg, {
                color:getColorEF(t.efmax),
                weight:4
            });
            drawnItems.addLayer(poly);
            allPoints.push(...seg);
        });

        /* --- CARTE : ZONES --- */
        t.zones.forEach(z => {
            const poly = L.polygon(z.coords, {
                color:getColorEF(z.ef),
                weight:2,
                fillOpacity:0.3
            });
            drawnItems.addLayer(poly);
            allPoints.push(...z.coords);
        });
    });

    /* --- CENTRAGE GLOBAL --- */
    if (allPoints.length > 0) {
        const bounds = L.latLngBounds(allPoints.map(p => L.latLng(p[0], p[1])));
        map.fitBounds(bounds, { padding:[20,20] });
    }
}

/* ============================================================
   ZOOM SUR UNE TORNADO
   ============================================================ */
function zoomSurTornade(t) {
    let points = [
        ...t.trajectoire.flat(),
        ...t.zones.flatMap(z => z.coords)
    ];

    if (points.length > 0) {
        const bounds = L.latLngBounds(points.map(p => L.latLng(p[0], p[1])));
        map.fitBounds(bounds, { padding:[20,20] });
    }
}

/* ============================================================
   COULEURS EF
   ============================================================ */
function getColorEF(ef) {
    switch (ef) {
        case "EF0": return "#007bff";
        case "EF1": return "#00cc44";
        case "EF2": return "#ffeb3b";
        case "EF3": return "#ff9800";
        case "EF4": return "#ff0000";
        case "EF5": return "#8e24aa";
        default: return "#ffffff";
    }
}
</script>

</body>
</html>
