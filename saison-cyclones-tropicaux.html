<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Saison Cyclones – Spectateur</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
    margin: 0;
    background: radial-gradient(circle at 20% 10%, #07101f, #020712 70%, #000000 100%);
    color: #f5f5f5;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#top-bar {
    height: 40px;
    width: 100vw;
    background: rgba(0,0,0,0.75);
    border-bottom: 1px solid #1e90ff;
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #e5e7eb;
    font-size: 14px;
    backdrop-filter: blur(14px);
}

.container {
    display: flex;
    height: calc(100vh - 40px);
    width: 100vw;
}

#sidebar {
    width: 330px;
    background: rgba(0,0,0,0.55);
    border-right: 1px solid rgba(255,255,255,0.15);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    backdrop-filter: blur(14px);
}

#liste-cyclones {
    flex: 1;
    overflow-y: auto;
    margin-top: 6px;
    padding-right: 4px;
}

/* ======== CARTE AVIS (STYLE ADMIN) ======== */
.avis-card {
    background: rgba(0,0,0,0.55);
    border-left: 4px solid #1e90ff;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    box-shadow: 0 0 15px rgba(30,144,255,0.4);
    cursor: pointer;
}

.avis-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: bold;
}

.avis-card-icon {
    width: 14px;
    height: 14px;
    border-radius: 50%;
}

.avis-card-info {
    margin-top: 8px;
    font-size: 15px;
    opacity: 0.85;
}

#main {
    flex: 1;
    position: relative;
    background: #020617;
}

#map {
    height: 100%;
    width: 100%;
}
</style>
</head>

<body>

<div id="top-bar">
    APTC – Saison Cyclones Tropicaux
    <span style="margin-left:10px; font-size:12px; color:#9ca3af;">Visualisation publique</span>
</div>

<div class="container">

    <div id="sidebar">
        <h2>Saison Cyclones Tropicaux</h2>
        <div id="annee-active">Année active : <span id="annee-label">2026</span></div>

        <h3 style="font-size:14px; margin-top:6px;">Cyclones de l’année</h3>
        <div id="liste-cyclones"></div>
    </div>

    <div id="main">
        <div id="map"></div>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ============================================================
   VARIABLES
   ============================================================ */
let map;
let drawnItems;
let cyclones = [];
let anneeActive = 2026;

/* ============================================================
   COULEURS + FORMES
   ============================================================ */
const cycloneColors = {
    "depression_tropicale": "#4da6ff",
    "tempete_tropicale": "#00cc44",
    1: "#ffeb3b",
    2: "#ffb347",
    3: "#cc5500",
    4: "#ff0000",
    5: "#ff66cc",
    "depression_subtropicale": "#8e24aa",
    "tempete_subtropicale": "#7CFC00",
    "depression_extratropicale": "#4da6ff",
    "tempete_extratropicale": "#33ff77",
    "extratropicale_cat1": "#fff066",
    "extratropicale_cat2": "#ffb347",
    "post_tropical": "#999999"
};

function markerCarre(couleur) {
    return L.divIcon({
        className: "",
        html: `<div style="width:14px;height:14px;background:${couleur};border:2px solid black;"></div>`
    });
}

function markerTriangle(couleur) {
    return L.divIcon({
        className: "",
        html: `
            <div style="
                position: relative;
                width: 0;
                height: 0;
                border-left: 8px solid transparent;
                border-right: 8px solid transparent;
                border-bottom: 14px solid ${couleur};
            ">
                <div style="
                    position: absolute;
                    top: 2px;
                    left: -9px;
                    width: 0;
                    height: 0;
                    border-left: 9px solid transparent;
                    border-right: 9px solid transparent;
                    border-bottom: 16px solid black;
                    z-index: -1;
                "></div>
            </div>
        `
    });
}

function markerCercle(couleur) {
    return L.divIcon({
        className: "",
        html: `<div style="width:14px;height:14px;background:${couleur};border-radius:50%;border:2px solid black;"></div>`
    });
}

function getMarkerForm(cat) {
    const c = cycloneColors[cat] || "#00aaff";

    if (cat.includes("subtropicale")) return markerCarre(c);
    if (cat.includes("extratropical") || cat === "post_tropical") return markerTriangle(c);
    return markerCercle(c);
}

/* ============================================================
   INIT
   ============================================================ */
function initMap() {
    map = L.map('map').setView([20, 0], 3);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 8
    }).addTo(map);

    drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);
}

function initData() {
    cyclones = JSON.parse(localStorage.getItem("avisCycloniques2026") || "[]");
}

/* ============================================================
   AFFICHAGE CARTE AVIS (STYLE ADMIN)
   ============================================================ */
function afficherCarteAvis(c) {
    const div = document.createElement("div");
    div.className = "avis-card";

    const header = document.createElement("div");
    header.className = "avis-card-header";

    const icon = document.createElement("div");
    icon.className = "avis-card-icon";
    icon.style.backgroundColor = cycloneColors[c.categorie] || "#ffffff";

    const title = document.createElement("div");
    title.textContent = `${c.nom} — ${c.categorieLabel}`;

    header.appendChild(icon);
    header.appendChild(title);

    const info = document.createElement("div");
    info.className = "avis-card-info";
    info.innerHTML = `
        <strong>Bassin :</strong> ${c.bassin}<br>
        <strong>ID :</strong> ${c.id}<br>
        <strong>Décès :</strong> ${c.deces || "N/A"}<br>
        <strong>Dommages :</strong> ${c.dommages || "N/A"}<br>
        <strong>Région :</strong> ${c.region || "N/A"}<br>
        <strong>Source :</strong> ${c.source || "N/A"}<br>
        <strong>Description :</strong> ${c.description || "N/A"}
    `;

    div.appendChild(header);
    div.appendChild(info);

    return div;
}

/* ============================================================
   AFFICHAGE LISTE
   ============================================================ */
function afficherListe() {
    const div = document.getElementById("liste-cyclones");
    div.innerHTML = "";

    if (cyclones.length === 0) {
        div.innerHTML = "<div style='font-size:12px;color:#9ca3af;'>Aucun cyclone enregistré.</div>";
        return;
    }

    cyclones.forEach(c => {
        const card = afficherCarteAvis(c);
        card.addEventListener("click", () => afficherTrajectoire(c));
        div.appendChild(card);
    });
}

/* ============================================================
   AFFICHAGE TOUTES TRAJECTOIRES AU DÉMARRAGE
   ============================================================ */
function afficherToutesTrajectoires() {
    drawnItems.clearLayers();

    let allPts = [];

    cyclones.forEach(c => {
        if (!c.trajectoire) return;

        c.trajectoire.forEach(seg => {
            // Points
            seg.forEach(p => {
                const marker = L.marker([p.lat, p.lon], {
                    icon: getMarkerForm(p.categorie)
                });
                drawnItems.addLayer(marker);
                allPts.push([p.lat, p.lon]);
            });

            // Segments
            for (let i = 1; i < seg.length; i++) {
                const prev = seg[i - 1];
                const curr = seg[i];

                const poly = L.polyline(
                    [
                        [prev.lat, prev.lon],
                        [curr.lat, curr.lon]
                    ],
                    {
                        color: cycloneColors[curr.categorie],
                        weight: 4,
                        opacity: 0.9
                    }
                );
                drawnItems.addLayer(poly);
            }
        });
    });

    if (allPts.length > 0) {
        const bounds = L.latLngBounds(allPts);
        map.fitBounds(bounds, { padding: [20,20] });
    }
}

/* ============================================================
   AFFICHAGE TRAJECTOIRE INDIVIDUELLE
   ============================================================ */
function afficherTrajectoire(c) {
    drawnItems.clearLayers();

    if (!c.trajectoire || c.trajectoire.length === 0) return;

    let allPts = [];

    c.trajectoire.forEach(seg => {
        seg.forEach(p => {
            const marker = L.marker([p.lat, p.lon], {
                icon: getMarkerForm(p.categorie)
            });
            drawnItems.addLayer(marker);
            allPts.push([p.lat, p.lon]);
        });

        for (let i = 1; i < seg.length; i++) {
            const prev = seg[i - 1];
            const curr = seg[i];

            const poly = L.polyline(
                [
                    [prev.lat, prev.lon],
                    [curr.lat, curr.lon]
                ],
                {
                    color: cycloneColors[curr.categorie],
                    weight: 4,
                    opacity: 0.9
                }
            );
            drawnItems.addLayer(poly);
        }
    });

    if (allPts.length > 0) {
        const bounds = L.latLngBounds(allPts);
        map.fitBounds(bounds, { padding: [20,20] });
    }
}

/* ============================================================
   LANCEMENT
   ============================================================ */
initMap();
initData();
afficherListe();
afficherToutesTrajectoires();   // <--- Affichage global au démarrage
</script>

</body>
</html>
