<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>APTC - Actualités (Admin)</title>

<style>
    /* ======== FOND ATMOSPHÉRIQUE ANIMÉ 1000× ======== */
    body {
        margin: 0;
        background: radial-gradient(circle at 20% 10%, #0a1a2f, #020712 70%, #000000 100%);
        color: white;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    /* Halo météo animé */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 10% 0%, rgba(30,144,255,0.45), transparent 60%),
            radial-gradient(circle at 90% 100%, rgba(0,206,209,0.35), transparent 60%);
        opacity: 0.45;
        pointer-events: none;
        mix-blend-mode: screen;
        animation: haloMove 12s infinite alternate ease-in-out;
    }

    @keyframes haloMove {
        0% { transform: translateY(0px); }
        100% { transform: translateY(20px); }
    }

    /* Grain léger */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.10;
        pointer-events: none;
    }

    /* ======== NAVBAR CINÉMATIQUE ======== */
    .navbar {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        padding: 12px 24px;
        border-bottom: 2px solid #1e90ff;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;

        backdrop-filter: blur(18px) saturate(180%);
        box-shadow: 0 0 40px rgba(0,0,0,0.8);

        background-image:
            radial-gradient(circle at 0% 0%, rgba(30,144,255,0.35), transparent 60%),
            radial-gradient(circle at 100% 100%, rgba(0,206,209,0.30), transparent 60%);
    }

    .navbar img {
        height: 48px;
        margin-right: 12px;
        filter: drop-shadow(0 0 12px rgba(30,144,255,1));
    }

    .navbar .title {
        font-size: 24px;
        font-weight: bold;
        margin-right: 40px;
        color: #ffffff;
        letter-spacing: 1px;
        text-shadow: 0 0 16px rgba(30,144,255,1);
        animation: titleGlow 4s infinite ease-in-out;
    }

    @keyframes titleGlow {
        0% { text-shadow: 0 0 12px rgba(30,144,255,0.7); }
        50% { text-shadow: 0 0 24px rgba(30,144,255,1); }
        100% { text-shadow: 0 0 12px rgba(30,144,255,0.7); }
    }

    .navbar a {
        margin-right: 22px;
        text-decoration: none;
        color: #cfe8ff;
        font-size: 18px;
        transition: 0.3s;
        position: relative;
    }

    .navbar a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -4px;
        width: 0%;
        height: 2px;
        background: #1e90ff;
        transition: width 0.3s;
        box-shadow: 0 0 10px #1e90ff;
    }

    .navbar a:hover::after {
        width: 100%;
    }

    .navbar a:hover {
        color: #1e90ff;
        text-shadow: 0 0 12px rgba(30,144,255,1);
    }

    /* ======== BOUTON PUBLIER ======== */
    .publish-btn {
        position: fixed;
        top: 90px;
        right: 20px;
        background: linear-gradient(135deg, #1e90ff, #63b3ff);
        padding: 12px 22px;
        border-radius: 14px;
        color: white;
        font-size: 17px;
        text-decoration: none;
        border: 2px solid #63b3ff;
        transition: 0.3s;
        z-index: 900;
        box-shadow: 0 0 18px rgba(30,144,255,0.7);
        font-weight: bold;
    }

    .publish-btn:hover {
        background: #63b3ff;
        box-shadow: 0 0 26px rgba(30,144,255,0.9);
        transform: translateY(-2px);
    }

    /* ======== CONTENEUR ======== */
    .container {
        width: 90%;
        margin: 110px auto;
    }

    /* ======== CATÉGORIES ======== */
    .categories {
        display: flex;
        gap: 10px;
        margin-bottom: 28px;
        margin-left: 5px;
    }

    .categories button {
        background: rgba(0,0,0,0.5);
        border: 2px solid #1e90ff;
        padding: 10px 15px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-size: 15px;
        transition: 0.3s;
        box-shadow: 0 0 10px rgba(30,144,255,0.4);
    }

    .categories button:hover,
    .categories button.active {
        background: #1e90ff;
        box-shadow: 0 0 18px rgba(30,144,255,0.8);
    }

    /* ======== GRILLE ======== */
    #newsContainer {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 35px;
        justify-items: center;
    }

    /* ======== CARTE ACTUALITÉ — VERSION 1000× ======== */
    .news-card {
        background: radial-gradient(circle at top, rgba(10,20,40,0.9), rgba(0,0,0,0.7));
        border: 2px solid #1e90ff;
        border-radius: 20px;
        padding: 18px;
        width: 380px;
        box-shadow: 0 0 32px rgba(30,144,255,0.45);
        text-align: center;
        animation: fadeIn 0.45s ease;
        transition: 0.3s;
        transform: translateY(0);
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
    }

    .news-card::before {
        content: "";
        position: absolute;
        top: -40px;
        left: -40px;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(30,144,255,0.6), transparent 60%);
        opacity: 0.4;
        pointer-events: none;
        animation: glowMove 6s infinite alternate ease-in-out;
    }

    @keyframes glowMove {
        0% { transform: translate(0,0); }
        100% { transform: translate(20px,20px); }
    }

    .news-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 0 42px rgba(30,144,255,0.9);
        border-color: #63b3ff;
    }

    /* Image premium */
    .news-card img {
        width: 100%;
        height: 185px;
        object-fit: cover;
        border-radius: 14px;
        margin-top: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
        cursor: pointer;
        transition: 0.3s;
    }

    .news-card img:hover {
        transform: scale(1.03);
    }

    /* Badge catégorie glossy */
    .badge {
        display: inline-block;
        background: linear-gradient(135deg, #1e90ff, #63b3ff);
        padding: 5px 12px;
        border-radius: 10px;
        font-size: 12px;
        margin-bottom: 8px;
        color: white;
        font-weight: bold;
        box-shadow: 0 0 12px rgba(30,144,255,0.7);
    }

    .news-card h2 {
        margin: 0;
        font-size: 19px;
        color: #cfe8ff;
        font-weight: bold;
        margin-top: 8px;
        text-shadow: 0 0 8px #1e90ff;
    }

    .news-card p {
        opacity: 0.88;
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.45;
    }

    .news-meta {
        opacity: 0.75;
        font-size: 12px;
        margin-top: 6px;
        font-style: italic;
    }

    /* Boutons */
    .btn {
        background: linear-gradient(135deg, #1e90ff, #63b3ff);
        border: none;
        padding: 7px 12px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        margin-right: 6px;
        transition: 0.3s;
        font-size: 13px;
        box-shadow: 0 0 12px rgba(30,144,255,0.6);
    }

    .btn:hover {
        background: #63b3ff;
        box-shadow: 0 0 20px rgba(30,144,255,0.9);
        transform: translateY(-1px);
    }

    .delete-btn {
        background: linear-gradient(135deg, #ff4444, #ff7777);
        box-shadow: 0 0 12px rgba(255,50,50,0.6);
    }

    .delete-btn:hover {
        background: #ff7777;
        box-shadow: 0 0 20px rgba(255,50,50,0.9);
    }

    /* Animation apparition */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ======== LIGHTBOX IMAGE ======== */
    .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s ease;
    }

    .lightbox.active {
        opacity: 1;
        pointer-events: auto;
    }

    .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 14px;
        box-shadow: 0 0 40px rgba(30,144,255,0.8);
        animation: zoomIn 0.35s ease;
    }

    @keyframes zoomIn {
        from { transform: scale(0.7); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 1100px) {
        #newsContainer {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 700px) {
        #newsContainer {
            grid-template-columns: repeat(1, 1fr);
        }
    }
</style>
</head>
<body>

<div class="navbar">
    <img src="logo.png" alt="Logo APTC">
    <div class="title">A.P.T.C — Admin</div>

    <a href="adminindex.html">Accueil</a>
    <a href="adminactualites.html">Actualités</a>
    <a href="adminalertes.html">Alertes</a>
    <a href="adminradars.html">Radars</a>
    <a href="adminrecherches.html">Recherches</a>
    <a href="adminrisques.html">Risques</a>
    <a href="adminsaison-tornades.html">Saison Tornades</a>
    <a href="adminsaison-cyclones-tropicaux.html">Saison Cyclones Tropicaux</a>
</div>

<a href="adminactualites-publier.html" class="publish-btn">➕ Publier une actualité</a>

<div class="container">

    <div class="categories">
        <button class="active" onclick="filtrer('Actualité')">Actualités</button>
        <button onclick="filtrer('Alerte')">Alertes</button>
        <button onclick="filtrer('Cyclone')">Cyclones</button>
        <button onclick="filtrer('Tornade')">Tornades</button>
        <button onclick="filtrer('Radar')">Radars</button>
    </div>

    <div id="newsContainer"></div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" onclick="fermerLightbox()">
    <img id="lightbox-img" src="">
</div>

<script>
let actualites = JSON.parse(localStorage.getItem("actualitesAPTC") || "[]");
let categorieActive = "Actualité";

function afficherActualites() {
    const container = document.getElementById("newsContainer");
    container.innerHTML = "";

    let filtered = actualites;

    if (categorieActive !== "Actualité") {
        filtered = actualites.filter(a => a.categorie === categorieActive);
    }

    if (filtered.length === 0) {
        container.innerHTML = "<p>Aucune actualité disponible.</p>";
        return;
    }

    filtered.forEach((actu, index) => {
        const card = document.createElement("div");
        card.className = "news-card";

        card.innerHTML = `
            <div class="badge">${actu.categorie}</div>
            <h2>${actu.titre}</h2>
            <div class="news-meta">${actu.date}</div>
            <p>${actu.contenu}</p>
            ${actu.image ? `<img src="${actu.image}" alt="Image actualité" onclick="ouvrirLightbox('${actu.image}')">` : ""}
            <br>
            <button class="btn" onclick="modifier(${index})">Modifier</button>
            <button class="btn delete-btn" onclick="supprimer(${index})">Supprimer</button>
        `;

        container.appendChild(card);
    });
}

function filtrer(cat) {
    categorieActive = cat;

    document.querySelectorAll(".categories button").forEach(btn => {
        btn.classList.remove("active");
        if (btn.textContent.includes(cat)) btn.classList.add("active");
    });

    afficherActualites();
}

function modifier(index) {
    window.location.href = "adminactualites-publier.html?edit=" + index;
}

function supprimer(index) {
    if (!confirm("Supprimer cette actualité ?")) return;

    actualites.splice(index, 1);
    localStorage.setItem("actualitesAPTC", JSON.stringify(actualites));
    afficherActualites();
}

/* ======== LIGHTBOX ======== */
function ouvrirLightbox(src) {
    const lb = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;
    lb.classList.add("active");
}

function fermerLightbox() {
    document.getElementById("lightbox").classList.remove("active");
}

afficherActualites();
</script>

</body>
</html>
